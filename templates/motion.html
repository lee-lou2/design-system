<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inkstone — 모션 카탈로그</title>
  <link rel="stylesheet" href="../assets/ds.css">
  <link rel="stylesheet" href="../assets/stage.css">
  <script src="../assets/icons.js" defer></script>
  <script src="../assets/motion.js" defer></script>
  <script src="../assets/stage.js" defer></script>
  <style>
    /* 데모 전용 키프레임: 강조 테두리가 세 곳을 차례로 옮겨 다닌다(M12) */
    @keyframes m12-hop {
      0%   { left: 573px; top: 22px; width: 547px; height: 203px; opacity: 0; animation-timing-function: var(--ease-out); }
      8%   { left: 573px; top: 22px; width: 547px; height: 203px; opacity: 1; }
      30%  { left: 573px; top: 22px; width: 547px; height: 203px; animation-timing-function: var(--ease-inout); }
      40%  { left: 22px; top: 450px; width: 1648px; height: 91px; }
      62%  { left: 22px; top: 450px; width: 1648px; height: 91px; animation-timing-function: var(--ease-inout); }
      72%  { left: 1123px; top: 22px; width: 547px; height: 203px; }
      100% { left: 1123px; top: 22px; width: 547px; height: 203px; opacity: 1; }
    }
    .m12-ring { animation: m12-hop 4800ms linear 500ms both; }
    .demo-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
  </style>
</head>
<body class="stage" style="--cols: 2">
  <header class="stage__head">
    <div>
      <h1 class="stage__title">모션 카탈로그 · 17종</h1>
      <p class="stage__desc">인포그래픽·설명 영상에서 자주 쓰는 움직임. 장면을 누르면 다시 재생해요. 모두 CSS 애니메이션이라 그대로 MP4·GIF로 내보낼 수 있어요.</p>
    </div>
    <nav class="stage__nav">
      <a href="../preview.html">시스템</a>
      <a href="thumbnail.html">1:1 썸네일</a>
      <a href="video.html">16:9 영상</a>
      <a href="shorts.html">9:16 숏폼</a>
      <a href="cases.html">실전 사례</a>
      <a href="motion.html" aria-current="page">모션</a>
    </nav>
  </header>

  <main class="board">

    <!-- M01 순차 등장 -->
    <figure class="cell">
      <figcaption class="cell__label">M01 순차 등장 <span>stagger</span></figcaption>
      <div class="cell__box">
        <section class="frame frame--16x9" data-frame="m01-stagger" data-duration="3400">
          <div class="demo-head"><div class="stack" style="--gap: 12px"><span class="kicker">모션 M01</span><h2 class="t-h2">순차 등장 — 목록·카드</h2></div><span class="t-mono c-3">rise · stagger 90ms · 480ms</span></div>
          <div class="spacer" style="--min: 40px"></div>
          <div class="grid cols-3" style="--gap: 24px">
            <div class="card row" data-m="rise" style="--d: 300ms; --gap: 24px; padding: 32px 36px"><span class="icon-tile"><i data-icon="list-checks"></i></span><div><p class="t-h3">계획</p><p class="t-label c-3" style="font-weight: 500">할 일을 나눠요</p></div></div>
            <div class="card row" data-m="rise" style="--d: 390ms; --gap: 24px; padding: 32px 36px"><span class="icon-tile"><i data-icon="wrench"></i></span><div><p class="t-h3">도구 호출</p><p class="t-label c-3" style="font-weight: 500">검색·API 실행</p></div></div>
            <div class="card row" data-m="rise" style="--d: 480ms; --gap: 24px; padding: 32px 36px"><span class="icon-tile"><i data-icon="database"></i></span><div><p class="t-h3">기억</p><p class="t-label c-3" style="font-weight: 500">대화·결과 저장</p></div></div>
            <div class="card row" data-m="rise" style="--d: 570ms; --gap: 24px; padding: 32px 36px"><span class="icon-tile"><i data-icon="search"></i></span><div><p class="t-h3">검색</p><p class="t-label c-3" style="font-weight: 500">필요한 자료 찾기</p></div></div>
            <div class="card row" data-m="rise" style="--d: 660ms; --gap: 24px; padding: 32px 36px"><span class="icon-tile"><i data-icon="play"></i></span><div><p class="t-h3">실행</p><p class="t-label c-3" style="font-weight: 500">코드·작업 진행</p></div></div>
            <div class="card row" data-m="rise" style="--d: 750ms; --gap: 24px; padding: 32px 36px"><span class="icon-tile"><i data-icon="file-text"></i></span><div><p class="t-h3">요약</p><p class="t-label c-3" style="font-weight: 500">결과를 짧게</p></div></div>
            <div class="card row" data-m="rise" style="--d: 840ms; --gap: 24px; padding: 32px 36px"><span class="icon-tile"><i data-icon="share-2"></i></span><div><p class="t-h3">공유</p><p class="t-label c-3" style="font-weight: 500">팀에 전달</p></div></div>
            <div class="card row" data-m="rise" style="--d: 930ms; --gap: 24px; padding: 32px 36px"><span class="icon-tile"><i data-icon="repeat"></i></span><div><p class="t-h3">반복</p><p class="t-label c-3" style="font-weight: 500">부족하면 다시</p></div></div>
            <div class="card card--focus row" data-m="rise" style="--d: 1020ms; --gap: 24px; padding: 32px 36px"><span class="icon-tile icon-tile--accent"><i data-icon="shield-check"></i></span><div><p class="t-h3" style="color: var(--accent-strong)">검증</p><p class="t-label" style="font-weight: 500; color: var(--accent-strong)">맞는지 다시 확인</p></div></div>
          </div>
          <div class="row" data-m="fade" style="--d: 1400ms; --gap: 12px; margin-top: 40px"><span class="chip chip--outline">겹치게 시작해 리듬을 만든다</span><span class="chip chip--outline">한 번에 2~3개까지</span></div>
          <div class="spacer" style="--min: 0px"></div>
        </section>
      </div>
    </figure>

    <!-- M02 한 번에 vs 차례로 채우기 -->
    <figure class="cell">
      <figcaption class="cell__label">M02 한 번에 · 차례로 <span>grid fill</span></figcaption>
      <div class="cell__box">
        <section class="frame frame--16x9" data-frame="m02-fill" data-duration="3200">
          <div class="demo-head"><div class="stack" style="--gap: 12px"><span class="kicker">모션 M02</span><h2 class="t-h2">채우기 — 한 번에 vs 물결</h2></div><span class="t-mono c-3">pop · all / (row+col) × 60ms</span></div>
          <div class="spacer" style="--min: 40px"></div>
          <div class="grid cols-2" style="--gap: 32px">
            <div class="card stack" style="--gap: 28px; align-items: center; padding: 36px">
              <div class="row row--between" style="width: 100%"><span class="t-h3">한 번에</span><span class="chip chip--sm">같은 무게의 묶음</span></div>
              <div class="grid" style="grid-template-columns: repeat(4, 104px); --gap: 22px"><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 400ms"><i data-icon="file-text"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 400ms"><i data-icon="image"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 400ms"><i data-icon="video"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 400ms"><i data-icon="mic"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 400ms"><i data-icon="table"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 400ms"><i data-icon="code"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 400ms"><i data-icon="mail"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 400ms"><i data-icon="calendar"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 400ms"><i data-icon="globe"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 400ms"><i data-icon="database"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 400ms"><i data-icon="folder"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 400ms"><i data-icon="chart-line"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 400ms"><i data-icon="users"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 400ms"><i data-icon="bell"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 400ms"><i data-icon="lock"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 400ms"><i data-icon="sparkles"></i></span></div>
            </div>
            <div class="card stack" style="--gap: 28px; align-items: center; padding: 36px">
              <div class="row row--between" style="width: 100%"><span class="t-h3">물결처럼 차례로</span><span class="chip chip--sm">순서·확산을 보여 줄 때</span></div>
              <div class="grid" style="grid-template-columns: repeat(4, 104px); --gap: 22px"><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 400ms"><i data-icon="file-text"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 460ms"><i data-icon="image"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 520ms"><i data-icon="video"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 580ms"><i data-icon="mic"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 460ms"><i data-icon="table"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 520ms"><i data-icon="code"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 580ms"><i data-icon="mail"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 640ms"><i data-icon="calendar"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 520ms"><i data-icon="globe"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 580ms"><i data-icon="database"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 640ms"><i data-icon="folder"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 700ms"><i data-icon="chart-line"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 580ms"><i data-icon="users"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 640ms"><i data-icon="bell"></i></span><span class="icon-tile" data-m="pop" style="--size: 104px; --d: 700ms"><i data-icon="lock"></i></span><span class="icon-tile icon-tile--accent" data-m="pop" style="--size: 104px; --d: 760ms"><i data-icon="sparkles"></i></span></div>
            </div>
          </div>
          <div class="spacer" style="--min: 0px"></div>
        </section>
      </div>
    </figure>

    <!-- M03 마스크 제목 + 핵심어 색 바꾸기 -->
    <figure class="cell">
      <figcaption class="cell__label">M03 제목 등장 <span>mask · tint</span></figcaption>
      <div class="cell__box">
        <section class="frame frame--16x9" data-frame="m03-title" data-duration="3400">
          <div class="demo-head"><div class="stack" style="--gap: 12px"><span class="kicker">모션 M03</span><h2 class="t-h2">제목 — 마스크 등장 + 핵심어 색</h2></div><span class="t-mono c-3">mask-up · 140ms · tint</span></div>
          <div class="spacer" style="--min: 40px"></div>
          <p style="font-size: 150px; font-weight: 700; letter-spacing: -0.045em; line-height: 1.2">
            <span class="mask"><span data-m="mask-up" style="--d: 300ms">도구를 연결하면</span></span>
            <span class="mask"><span data-m="mask-up" style="--d: 440ms">AI가 <span class="hl" data-m="tint" style="--d: 1300ms">직접</span></span></span>
            <span class="mask"><span data-m="mask-up" style="--d: 580ms">일해요</span></span>
          </p>
          <div data-m="grow-x" style="--d: 1000ms; width: 360px; height: 6px; margin-top: 48px; border-radius: 99px; background: var(--ink); transform-origin: left center"></div>
          <p class="t-body-lg c-2" data-m="rise" style="--d: 1400ms; margin-top: 32px">제목은 줄마다 올라오고, 핵심어는 마지막에 색만 바뀌어요</p>
          <div class="spacer" style="--min: 40px"></div>
          <div class="spacer" style="--min: 0px"></div>
        </section>
      </div>
    </figure>

    <!-- M04 플로우차트 그리기 + 흐르는 점 -->
    <figure class="cell">
      <figcaption class="cell__label">M04 플로우차트 그리기 <span>pop · draw · travel</span></figcaption>
      <div class="cell__box">
        <section class="frame frame--16x9" data-frame="m04-flow" data-duration="5200">
          <div class="demo-head"><div class="stack" style="--gap: 12px"><span class="kicker">모션 M04</span><h2 class="t-h2">플로우차트 — 노드 → 선 → 흐름</h2></div><span class="t-mono c-3">pop · draw 400ms · travel</span></div>
          <div class="spacer" style="--min: 40px"></div>
          <div class="rel" style="height: 500px">
            <svg width="1696" height="480" viewBox="0 0 1696 480" style="position: absolute; inset: 0" aria-hidden="true">
              <defs>
                <mask id="m04-loop" maskUnits="userSpaceOnUse" x="0" y="0" width="1696" height="480"><path d="M1080 328 V404 Q1080 428 1056 428 H639 Q615 428 615 404 V336" fill="none" stroke="#fff" stroke-width="12" pathLength="1" data-m="draw" style="--d: 2300ms; --dur: 700ms"/></mask>
              </defs>
              <path class="wire" pathLength="1" data-m="draw" style="--d: 550ms; --dur: 400ms" d="M308 180 H455"/>
              <path class="wire" pathLength="1" data-m="draw" style="--d: 1100ms; --dur: 400ms" d="M773 180 H920"/>
              <path class="wire wire--accent" pathLength="1" data-m="draw" style="--d: 1650ms; --dur: 400ms" d="M1238 180 H1386"/>
              <path class="wire-head" data-m="fade" style="--d: 900ms; --dur: 160ms" d="M445 170 L455 180 L445 190"/>
              <path class="wire-head" data-m="fade" style="--d: 1450ms; --dur: 160ms" d="M910 170 L920 180 L910 190"/>
              <path class="wire-head wire-head--accent" data-m="fade" style="--d: 2000ms; --dur: 160ms" d="M1376 170 L1386 180 L1376 190"/>
              <path class="wire wire--dashed" mask="url(#m04-loop)" d="M1080 328 V404 Q1080 428 1056 428 H639 Q615 428 615 404 V336"/>
              <path class="wire-head" data-m="fade" style="--d: 2950ms; --dur: 160ms" d="M605 346 L615 336 L625 346"/>
            </svg>
            <span class="t-label c-3" data-m="fade" style="--d: 2700ms; position: absolute; left: 848px; top: 410px; transform: translateX(-50%); padding: 0 14px; background: var(--canvas)">부족하면 다시 계획</span>
            <div data-m="fade" style="--d: 3100ms; --dur: 200ms; position: absolute; inset: 0; z-index: 1"><div data-m="out" style="--d: 4700ms"><span class="token" data-m="travel" style="--d: 3150ms; --dur: 1500ms; offset-path: path('M150 180 H1546')"></span></div></div>
            <div class="node node--col" data-m="pop" style="--d: 300ms; position: absolute; z-index: 2; left: 0; top: 40px; width: 300px; height: 280px"><span class="icon-tile icon-tile--lg"><i data-icon="message-square"></i></span><span>질문<span class="node__sub">사용자</span></span></div>
            <div class="node node--col" data-m="pop" style="--d: 850ms; position: absolute; z-index: 2; left: 465px; top: 40px; width: 300px; height: 280px"><span class="icon-tile icon-tile--lg"><i data-icon="list-checks"></i></span><span>계획<span class="node__sub">AI 에이전트</span></span></div>
            <div class="node node--col node--focus" data-m="pop" style="--d: 1400ms; position: absolute; z-index: 2; left: 930px; top: 40px; width: 300px; height: 280px"><span class="icon-tile icon-tile--lg icon-tile--accent"><i data-icon="wrench"></i></span><span>도구 실행<span class="node__sub">MCP 서버</span></span></div>
            <div class="node node--col" data-m="pop" style="--d: 1950ms; position: absolute; z-index: 2; left: 1396px; top: 40px; width: 300px; height: 280px"><span class="icon-tile icon-tile--lg"><i data-icon="sparkles"></i></span><span>답변<span class="node__sub">정리해 전달</span></span></div>
          </div>
          <div class="row" data-m="fade" style="--d: 3000ms; --gap: 12px; margin-top: 48px"><span class="chip chip--outline">① 노드가 차례로</span><span class="chip chip--outline">② 선이 이어 그려지고</span><span class="chip chip--outline">③ 흐름이 지나가요</span></div>
          <div class="spacer" style="--min: 0px"></div>
        </section>
      </div>
    </figure>

    <!-- M05 숫자 세기 -->
    <figure class="cell">
      <figcaption class="cell__label">M05 숫자 세기 <span>count · 쉼표 · 소수</span></figcaption>
      <div class="cell__box">
        <section class="frame frame--16x9" data-frame="m05-count" data-duration="3400">
          <div class="demo-head"><div class="stack" style="--gap: 12px"><span class="kicker">모션 M05</span><h2 class="t-h2">숫자 세기 — 함께 끝나게</h2></div><span class="t-mono c-3">count 1400ms · 12,400 · 4.8</span></div>
          <div class="spacer" style="--min: 40px"></div>
          <div class="grid cols-3" style="--gap: 24px">
            <div class="card stack" style="--gap: 0; padding: 52px 44px">
              <span class="row t-label c-2" style="--gap: 14px"><span class="icon-tile icon-tile--sm"><i data-icon="users"></i></span>주간 사용자</span>
              <span class="stat__value" style="margin-top: 32px; font-size: 112px"><span class="count count--comma" data-m="count" style="--n: 12400; --d: 300ms; --dur: 1400ms"></span><span class="stat__unit">명</span></span>
              <div class="stack" style="--gap: 10px; margin-top: 24px"><span style="height: 10px; border-radius: 99px; background: var(--line)"><span data-m="grow-x" style="--d: 300ms; --dur: 1400ms; display: block; height: 100%; width: calc(0.83 * 100%); border-radius: 99px; background: var(--ink); transform-origin: left"></span></span><span class="t-caption c-3" style="">15,000명 목표의 83%</span></div>
              <svg width="100%" height="96" viewBox="0 0 360 96" preserveAspectRatio="none" style="margin-top: 20px" aria-hidden="true"><path pathLength="1" data-m="draw" style="--d: 500ms; --dur: 1200ms" d="M0 80 L60 70 L120 74 L180 52 L240 46 L300 30 L360 18" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>
              <span class="chip chip--outline" data-m="pop" style="--d: 1800ms; margin-top: 24px; align-self: flex-start"><i data-icon="trending-up"></i>+1,200 · 지난주보다</span>
            </div>
            <div class="card stack" style="--gap: 0; padding: 52px 44px">
              <span class="row t-label c-2" style="--gap: 14px"><span class="icon-tile icon-tile--sm"><i data-icon="star"></i></span>평균 별점</span>
              <span class="stat__value" style="margin-top: 32px; font-size: 112px"><span class="count count--1dp" data-m="count" style="--n: 48; --d: 300ms; --dur: 1400ms"></span><span class="stat__unit">점</span></span>
              <div class="stack" style="--gap: 10px; margin-top: 24px"><span style="height: 10px; border-radius: 99px; background: var(--line)"><span data-m="grow-x" style="--d: 300ms; --dur: 1400ms; display: block; height: 100%; width: calc(0.96 * 100%); border-radius: 99px; background: var(--ink); transform-origin: left"></span></span><span class="t-caption c-3" style="">5점 만점</span></div>
              <svg width="100%" height="96" viewBox="0 0 360 96" preserveAspectRatio="none" style="margin-top: 20px" aria-hidden="true"><path pathLength="1" data-m="draw" style="--d: 500ms; --dur: 1200ms" d="M0 60 L60 66 L120 50 L180 54 L240 40 L300 36 L360 24" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>
              <span class="chip chip--outline" data-m="pop" style="--d: 1900ms; margin-top: 24px; align-self: flex-start"><i data-icon="trending-up"></i>+0.3 · 지난달보다</span>
            </div>
            <div class="card card--focus stack" style="--gap: 0; padding: 52px 44px">
              <span class="row t-label" style="--gap: 14px; color: var(--accent-strong)"><span class="icon-tile icon-tile--sm icon-tile--accent"><i data-icon="repeat"></i></span>재방문율</span>
