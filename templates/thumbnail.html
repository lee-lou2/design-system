  <main class="board">

    <!-- T1 벤토: 개념 하나를 흐름 + 숫자 + 단계 + 코드로 요약 (강의·튜토리얼) -->
    <figure class="cell">
      <figcaption class="cell__label">T1 벤토 <span>개념·튜토리얼 요약</span></figcaption>
      <div class="cell__box">
        <section class="frame frame--1x1" data-frame="t1-bento" style="--gap: 20px">
          <div class="meta">
            <span class="kicker">개발 강의</span>
            <span class="t-mono">EP.12</span>
          </div>
          <h2 class="t-h1" style="margin-top: 28px">Claude Code에<br><span class="hl">MCP 서버</span> 연결하기</h2>

          <div class="grid push" style="grid-template-columns: 1fr 1fr 1.32fr; grid-template-rows: auto 1fr; height: 612px">
            <div class="card span-3" style="padding: 28px 32px">
              <div class="card__head"><span class="t-mono">How it works</span><span class="t-caption">한 번 등록하면 끝</span></div>
              <div class="flow">
                <div class="node node--sm"><i data-logo="claude" style="font-size: 36px"></i>Claude Code</div>
                <span class="link"></span>
                <div class="node node--sm node--focus"><span class="icon-tile icon-tile--accent" style="--size: 44px"><i data-icon="plug"></i></span>MCP 서버</div>
                <span class="link"></span>
                <div class="node node--sm" style="gap: 18px">
                  <i data-logo="github" style="font-size: 36px"></i>
                  <i data-logo="notion" style="font-size: 36px"></i>
                  <i data-logo="figma" style="font-size: 36px"></i>
                </div>
              </div>
              <p class="t-caption c-2" style="margin-top: 18px">Claude Code가 MCP 서버를 거쳐 도구를 직접 다뤄요</p>

            <div class="card stack" style="--gap: 0">
              <span class="t-mono c-3">Steps</span>

                <li class="row" style="--gap: 14px"><span class="num num--sm">3</span><span class="t-label">말로 호출</span></li>
              </ol>
            </div>

            <div class="card card--inverse stack" style="--gap: 0">
              <span class="t-mono" style="color: var(--on-inverse-2)">Terminal</span>
              <p class="t-code" style="margin-top: 18px; font-size: 22px; line-height: 1.6; white-space: pre"><span style="color: var(--code-keyword)">$</span> claude mcp add \
    --transport http \
    github $MCP_URL</p>
              <span class="chip chip--sm push" style="align-self: flex-start; background: rgba(166, 211, 184, 0.16); color: var(--code-string)"><i data-icon="check"></i>Added github</span>
            </div>
          </div>
        </section>
      </div>
    </figure>

    <!-- T2 비교: 두 선택지를 작동 방식 + 체크 목록으로 -->
    <figure class="cell">
      <figcaption class="cell__label">T2 비교 <span>A vs B · 선택 가이드</span></figcaption>
      <div class="cell__box">
        <section class="frame frame--1x1" data-frame="t2-versus">
          <div class="meta">
            <span class="kicker">AI 강의</span>
            <span class="t-mono">Guide</span>
          </div>
          <h2 class="t-h1" style="margin-top: 28px"><span class="hl">RAG</span> vs 파인튜닝<br>언제 뭘 쓸까?</h2>

          <div class="compare push" style="height: 496px">
            <div class="card stack" style="--gap: 28px">
              <div class="row" style="--gap: 18px">
                <span class="icon-tile"><i data-icon="file-search"></i></span>
                <div><p class="t-h3">RAG</p><p class="t-caption c-3">찾아서 답하기</p></div>
              </div>
              <div class="flow">
                <span class="chip chip--sm chip--outline">문서</span><span class="link"></span>
                <span class="chip chip--sm chip--outline">검색</span><span class="link"></span>
                <span class="chip chip--sm chip--inverse">답변</span>
              </div>
              <ul class="checks push" style="gap: 12px">
                <li><i data-icon="check"></i>최신 문서 반영</li>
                <li><i data-icon="check"></i>출처를 보여 줌</li>
                <li><i data-icon="check"></i>근거 문서만 바꾸면 끝</li>
                <li class="is-no"><i data-icon="x"></i>말투는 그대로</li>
              </ul>
            </div>
            <span class="compare__vs">VS</span>
            <div class="card stack" style="--gap: 28px">
              <div class="row" style="--gap: 18px">
                <span class="icon-tile"><i data-icon="brain-circuit"></i></span>
                <div><p class="t-h3">파인튜닝</p><p class="t-caption c-3">익혀서 답하기</p></div>
              </div>
              <div class="flow">
                <span class="chip chip--sm chip--outline">예시</span><span class="link"></span>
                <span class="chip chip--sm chip--outline">학습</span><span class="link"></span>
                <span class="chip chip--sm chip--inverse">모델</span>
              </div>
              <ul class="checks push" style="gap: 12px">
                <li><i data-icon="check"></i>말투·형식 학습</li>
                <li><i data-icon="check"></i>짧은 프롬프트</li>
                <li><i data-icon="check"></i>답이 짧고 빨라요</li>
                <li class="is-no"><i data-icon="x"></i>새 정보는 재학습</li>
              </ul>
            </div>
          </div>

          <div class="row card card--focus" style="margin-top: 20px; padding: 20px 28px; --gap: 16px; border-radius: 24px">

            <p class="t-label" style="color: var(--accent-strong)">지식은 RAG, 말투·형식은 파인튜닝</p>
          </div>
        </section>
      </div>
    </figure>

    <!-- T3 흐름: 단계 + 되돌아가는 화살표 + 입력·결과 (작동 원리) -->

            <span class="kicker">AI 강의</span>
            <span class="t-mono">Agent 101</span>
          </div>

            <div class="rel" style="margin-top: 36px">
              <div class="flow">
                <div class="node node--col" style="width: 176px"><span class="icon-tile icon-tile--line"><i data-icon="list-checks"></i></span><span class="t-label">계획<span class="node__sub">할 일 나누기</span></span></div>

                <span class="link link--accent"></span>
                <div class="node node--col node--focus" style="width: 176px"><span class="icon-tile icon-tile--accent"><i data-icon="message-square"></i></span><span class="t-label">답변<span class="node__sub">정리해 전달</span></span></div>
              </div>
              <svg width="872" height="64" viewBox="0 0 872 64" style="position: absolute; left: 0; top: 100%" aria-hidden="true">

              <span class="chip chip--outline">예약 링크</span>
            </div>
          </div>
        </section>
      </div>
    </figure>

                <div class="row" style="--gap: 14px"><span class="icon-tile icon-tile--sm"><i data-icon="folder-open"></i></span><span class="t-h3" style="font-size: 36px">블로그 글쓰기</span></div>
