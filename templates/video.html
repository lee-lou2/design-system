<pre style="--code-fs: 26px; padding: 24px 32px"><span class="line"><span class="o">{</span></span><span class="line">  <span class="k">"name"</span>: <span class="s">"list_pull_requests"</span>,</span><span class="line">  <span class="k">"arguments"</span>: <span class="o">{</span> <span class="k">"state"</span>: <span class="s">"open"</span> <span class="o">}</span></span><span class="line"><span class="o">}</span></span></pre>
